aid: 4r
name: 4R Systems
description: '4R (4R Systems, Inc.) is a Berwyn, Pennsylvania software company founded
  in 1999 that sells a cloud-based intelligent inventory optimization platform and
  planning service to retail chains. Its prescriptive-analytics products cover demand
  planning, replenishment planning, allocation planning, assortment optimization,
  markdown optimization and vendor order optimization, combining statistical and
  machine-learning forecasting with a managed "planning as a service" team. Customers
  reach the platform through a hosted web portal and scheduled data exchanges rather
  than a public developer API; 4R publishes no developer portal, documentation or
  machine-readable API contract on its public site.'
